<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz results</title>
<style>
  :root { color-scheme: light; }
  body { margin:0; font:16px/1.5 -apple-system,system-ui,sans-serif; background:#faf9f7; color:#121211; }
  header { padding:56px 24px 24px; }
  .eyebrow { font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:#94918b; margin:0; }
  h1 { font-size:28px; line-height:1.15; letter-spacing:-.02em; margin:12px 0 0; }
  main { padding:0 24px 40px; }
  .card { background:#fff; border:1px solid rgba(0,0,0,.08); border-radius:14px; padding:20px; margin-top:20px; }
  .card p { margin:8px 0 0; color:#6e6c67; font-size:14px; }
  .why { font-size:13px; color:#94918b; margin-top:28px; }
  button { margin-top:20px; width:100%; padding:14px; border:0; border-radius:10px; background:#121211; color:#fff; font-size:15px; }
</style>
<header>
  <p class="eyebrow">Your result</p>
  <h1>Start with the seeded rye.</h1>
</header>
<main>
  <div class="card">
    <strong>Seeded rye, twice a week</strong>
    <p>Dense, slow, and it keeps. You said you eat breakfast standing up — this survives that.</p>
    <button>Start with this</button>
  </div>
  <p class="why">Because you chose savoury, and said you cook most nights.</p>
</main>
