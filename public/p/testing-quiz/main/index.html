<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>every — onboarding quiz v15</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1A1614; --ink-soft:#6B6560; --ink-mute:#948D86;
    --surface:#F2F1EF; --line:#DEDCD8;
    --accent:#E8A05C; --btn:#221C18; --cream:#F8F4EC; --tile:#F5F2EC; --grey:#EDEBE7;
    --green:#4A5530;
    --ease:cubic-bezier(.25,.68,.15,1);
    --t-best:#EFE6D6; --t-protein:#E2E8DE; --t-fibre:#E4E6DC; --t-new:#EAE2EA; --t-fresh:#DEE7E8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:#E8E6E2;font-family:'Inter',-apple-system,sans-serif;color:var(--ink);
    display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:22px 16px 40px}
  .chrome{display:flex;gap:6px;align-items:center;margin-bottom:16px;flex-wrap:wrap;justify-content:center}
  .chrome span{font-size:12px;color:#7C766F;margin-right:4px}
  .chrome button{font-family:inherit;font-size:12px;padding:6px 14px;border-radius:999px;
    border:1px solid #CFCCC7;background:#F7F6F4;color:#4A4540;cursor:pointer;transition:.3s var(--ease)}
  .chrome button[aria-pressed="true"]{background:var(--btn);color:#fff;border-color:var(--btn)}

  .stage{display:flex;align-items:flex-start;gap:20px;justify-content:center;width:100%}
  .phone{width:100%;max-width:390px;height:812px;background:#fff;border-radius:34px;overflow:hidden;
    box-shadow:0 1px 2px rgba(0,0,0,.06),0 18px 50px rgba(0,0,0,.14);
    display:flex;flex-direction:column;position:relative;flex-shrink:0;transition:background .5s var(--ease)}
  .phone.cream{background:var(--cream)}
  .screen{flex:1;display:flex;flex-direction:column;padding:24px 24px 0;overflow-y:auto;overflow-x:hidden}
  .screen.flush{padding:0}

  .page{display:flex;flex-direction:column;flex:1}
  @keyframes pushIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
  @keyframes popIn{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:translateX(0)}}
  .page.push{animation:pushIn .45s var(--ease) both}
  .page.pop{animation:popIn .45s var(--ease) both}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  .page h1,.page .sub,.page .opt{animation:rise .55s var(--ease) both}

  .qlabel{font-size:12.5px;color:var(--ink-mute);margin:0 0 14px;animation:rise .5s var(--ease) both}
  .progress{display:flex;gap:4px;margin-bottom:22px;flex-shrink:0}
  .progress i{flex:1;height:4px;border-radius:99px;background:#E7E5E1;position:relative;overflow:hidden}
  .progress i::after{content:'';position:absolute;inset:0;background:var(--accent);
    transform:scaleX(0);transform-origin:left;transition:transform .45s var(--ease)}
  .progress i.done::after{transform:scaleX(1)}

  h1{font-family:'Newsreader',Georgia,serif;font-weight:400;font-size:30px;line-height:1.17;
    letter-spacing:-.01em;margin:0 0 10px}
  h1.solo{margin-bottom:22px}
  .sub{font-size:14px;line-height:1.45;color:var(--ink-soft);margin:0 0 20px}

  /* list options */
  .opts{display:flex;flex-direction:column;gap:9px;padding-bottom:22px}
  .opt{display:flex;align-items:center;gap:13px;width:100%;background:var(--surface);
    border:1.5px solid transparent;border-radius:15px;padding:16px 18px;font-family:inherit;
    font-size:15px;color:var(--ink);text-align:left;cursor:pointer;
    transition:border-color .25s var(--ease),background .25s var(--ease),transform .18s var(--ease)}
  .opt em{font-style:normal;font-size:18px;width:21px;text-align:center;flex-shrink:0}
  .opt:active{transform:scale(.985)}
  .opt[aria-pressed="true"]{background:#fff;border-color:var(--btn)}
  .opt .tick{margin-left:auto;font-size:13px;color:var(--btn);opacity:0;transition:.2s}
  .opt[aria-pressed="true"] .tick{opacity:1}

  /* square options */
  .opts.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-bottom:22px}
  .opts.grid .opt{flex-direction:column;justify-content:center;gap:12px;padding:22px 12px;
    text-align:center;min-height:132px;font-size:14.5px;line-height:1.3}
  .opts.grid .opt em{font-size:28px;width:auto}
  .opts.grid .opt span{max-width:15ch}

  /* slider */
  .satstage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:120px}
  .satface{font-size:88px;line-height:1;transition:transform .22s var(--ease)}
  .satface.bump{transform:scale(1.09)}
  .satzone{font-size:15.5px;font-weight:500;margin:16px 0 0;text-align:center;min-height:21px}
  .satmsg{min-height:92px;display:flex;align-items:flex-end;padding-bottom:14px}
  .satmsg .inner{background:var(--surface);border-radius:15px;padding:15px 17px;font-size:14px;
    line-height:1.5;color:var(--ink-soft);width:100%;opacity:0;transform:translateY(10px);
    transition:.5s var(--ease)}
  .satmsg .inner.on{opacity:1;transform:none}
  .sliderwrap{padding-bottom:8px}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:38px;background:transparent;
    cursor:grab;margin:0;display:block}
  input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:99px;
    background:linear-gradient(90deg,var(--accent) var(--pct,50%),#E4E1DC var(--pct,50%))}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;border-radius:50%;
    background:#fff;border:1.5px solid var(--line);margin-top:-13px;box-shadow:0 2px 8px rgba(0,0,0,.13)}
  input[type=range]::-moz-range-track{height:6px;border-radius:99px;background:#E4E1DC}
  input[type=range]::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:#fff;border:1.5px solid var(--line)}
  .ends{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-soft);margin-top:2px}

  /* interstitial */
  .inter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;padding:0 38px;
    background:linear-gradient(180deg,#FCF6E4 0%,#FAF8F2 42%,#EFF2F6 100%)}
  .inter .mark{width:76px;height:76px;border-radius:50%;background:var(--accent);display:flex;
    align-items:center;justify-content:center;margin-bottom:34px;animation:pop .45s var(--ease) both}
  .inter .mark svg{width:38px;height:38px}
  @keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
  .inter h1{font-size:36px;line-height:1.12;margin:0 0 16px;animation:rise .55s var(--ease) .12s both}
  .inter p{font-size:16px;line-height:1.45;color:var(--ink-soft);margin:0;
    animation:rise .55s var(--ease) .22s both}

  .footer{flex-shrink:0;display:flex;gap:11px;align-items:center;padding:16px 24px 26px}
  .footer:empty{display:none}
  .footer.over{position:absolute;left:0;right:0;bottom:0;z-index:3}
  .back{width:54px;height:54px;border-radius:15px;flex-shrink:0;border:1.5px solid var(--line);
    background:rgba(255,255,255,.6);color:var(--ink);font-size:19px;cursor:pointer;font-family:inherit}
  .cta{flex:1;height:54px;border-radius:15px;border:none;background:var(--btn);color:#fff;
    font-family:inherit;font-size:15.5px;font-weight:500;cursor:pointer;display:flex;
    align-items:center;justify-content:center;transition:opacity .3s var(--ease)}
  .cta[disabled]{opacity:.28;cursor:default}

  /* intro */
  .intro{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;justify-content:center}
  .intro h1{font-size:34px;margin:0 0 14px}
  .intro .lead{font-size:15.5px;line-height:1.5;color:var(--ink-soft);margin:0;max-width:30ch;
    animation:rise .6s var(--ease) .08s both}
  .intro ul{list-style:none;margin:38px 0 0;padding:0;width:100%;max-width:300px;text-align:left}
  .intro li{display:flex;gap:13px;align-items:baseline;font-size:14.5px;line-height:1.5;padding:13px 0;
    border-bottom:1px solid rgba(26,22,20,.09);animation:rise .6s var(--ease) both}
  .intro li:first-child{border-top:1px solid rgba(26,22,20,.09)}
  .intro b{font-family:'Newsreader',serif;font-weight:400;color:var(--accent);width:14px;flex-shrink:0}

  /* loader */
  .load{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .load h1{font-size:28px;margin-bottom:6px}
  .load p{font-size:14.5px;color:var(--ink-soft);margin:0 0 36px}
  .ring{width:42px;height:42px;border-radius:50%;border:2px solid #E7E5E1;border-top-color:var(--accent);
    animation:spin 1s linear infinite;margin-bottom:34px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;max-width:300px;min-height:96px}
  @keyframes chipIn{from{opacity:0;transform:translateY(9px) scale(.94)}to{opacity:1;transform:none}}
  .chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;
    font-size:13px;animation:chipIn .45s var(--ease) both;white-space:nowrap}

  /* ── match screen ── */
  .matchwrap{flex:1;display:flex;flex-direction:column;background:var(--cream);overflow:hidden}
  .matchnav{display:flex;align-items:center;justify-content:space-between;padding:20px 22px 0;flex-shrink:0}
  .matchnav button{width:44px;height:44px;border-radius:50%;border:none;background:#fff;color:var(--ink);
    font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .matchnav h1{font-size:27px;margin:0;flex:1;text-align:center}
  .matchrail{display:flex;gap:16px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;
    scroll-snap-type:x mandatory;padding:22px 7% 14px;cursor:grab;align-items:flex-start}
  .matchrail.dragging{cursor:grabbing;scroll-snap-type:none}
  .matchrail::-webkit-scrollbar{display:none}
  .matchcard{flex:0 0 86%;height:596px;scroll-snap-align:center;background:#fff;border-radius:18px;
    overflow:hidden;border:2px solid transparent;opacity:.85;display:flex;flex-direction:column;
    transition:border-color .3s var(--ease),box-shadow .3s var(--ease),opacity .3s var(--ease)}
  .matchcard.active{opacity:1;box-shadow:0 8px 26px rgba(26,22,20,.12)}
  .matchimg{height:158px;flex-shrink:0;position:relative;display:flex;align-items:center;
    justify-content:center;font-size:44px}
  .matchbadge{position:absolute;top:14px;left:14px;background:#fff;color:var(--ink);font-size:13.5px;
    font-weight:500;padding:7px 15px 7px 7px;border-radius:999px;display:flex;align-items:center;gap:8px}
  .matchbadge b{width:22px;height:22px;border-radius:50%;background:var(--btn);color:#fff;font-size:11px;
    display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .matchbody{padding:20px 20px 18px;flex:1;display:flex;flex-direction:column;min-height:0}
  .matchbody h3{font-family:'Newsreader',serif;font-weight:400;font-size:28px;margin:0 0 10px;line-height:1.1}
  .matchdesc{font-size:14px;line-height:1.45;color:var(--ink-soft);margin:0 0 14px;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .mtags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:17px}
  .mtag{border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;white-space:nowrap}
  .spec{border-top:1px solid var(--line)}
  .specrow{padding:13px 0;border-bottom:1px solid var(--line)}
  .specrow .lab{display:block;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;
    color:var(--ink-mute);margin-bottom:8px}
  .contents{display:flex;flex-direction:column;gap:8px}
  .citem{display:flex;align-items:center;font-size:16px}
  .stack{display:inline-flex;align-items:center;margin-right:13px;flex-shrink:0}
  .stack i{width:18px;height:18px;border-radius:50%;background:var(--tile);border:1.5px solid #fff;
    margin-left:-7px;flex-shrink:0}
  .stack i:first-child{margin-left:0}
  .nut{display:grid;grid-template-columns:repeat(3,1fr);padding:12px 0 14px;gap:8px;
    border-bottom:1px solid var(--line)}
  .nut .lab{display:block;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;
    color:var(--ink-mute);margin-bottom:7px}
  .nut .val{display:block;font-size:17px}
  .matchcta{width:100%;height:54px;border-radius:999px;border:none;background:var(--btn);color:#fff;
    font-family:inherit;font-size:16px;font-weight:500;cursor:pointer;margin-top:auto;flex-shrink:0}
  .matchdots{display:flex;justify-content:center;gap:7px;padding:4px 0 26px}
  .dot{width:7px;height:7px;border-radius:50%;background:#DAD7D2;transition:.3s var(--ease)}
  .dot.on{background:var(--ink);width:20px;border-radius:99px}

  /* results */
  .res{flex:1;display:flex;flex-direction:column;padding-bottom:24px}
  .navbar{display:flex;align-items:center;padding:20px 0 10px}
  .navbar button{background:none;border:none;font-size:20px;color:var(--ink);cursor:pointer;
    font-family:inherit;padding:0;width:28px;text-align:left}
  .navbar h6{margin:0 auto;font-size:13.5px;font-weight:400;transform:translateX(-14px)}
  .heroblock{background:var(--grey);border-radius:0 0 26px 26px;padding:0 24px 28px;margin-bottom:6px}
  .hero-img{height:200px;border-radius:18px;background:var(--green);margin-bottom:20px;display:flex;
    align-items:center;justify-content:center;font-size:48px}
  .planname{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 8px}
  .res h1{font-size:31px;margin:0 0 16px;letter-spacing:-.015em}
  .res h1 i{font-style:italic}
  .tagrow{display:flex;flex-wrap:wrap;gap:7px}
  .utag{background:#fff;border-radius:999px;padding:8px 14px;font-size:13px;display:flex;
    align-items:center;gap:6px;white-space:nowrap}
  .utag em{font-style:normal;font-size:13px}
  .mapsec{margin-top:26px}
  .mapsec h2{font-family:'Newsreader',serif;font-weight:400;font-size:22px;margin:0 0 13px}
  .maprail{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x mandatory;
    scroll-padding-left:24px;margin:0 -24px;padding:0 24px 4px}
  .maprail::-webkit-scrollbar{display:none}
  .mapcard{flex:0 0 206px;scroll-snap-align:start;background:#fff;border-radius:16px;
    padding:16px 16px 15px;display:flex;flex-direction:column}
  .mapcard .ic{font-size:20px;line-height:1;margin-bottom:18px}
  .mapcard .src{font-size:12px;color:var(--ink-mute);background:var(--surface);border-radius:7px;
    padding:5px 9px;align-self:flex-start;font-style:italic;margin-bottom:10px}
  .mapcard p{font-size:14px;line-height:1.45;margin:0;flex:1}
  .sechead{padding:32px 24px 0;display:flex;align-items:baseline;gap:12px}
  .sechead h2{font-family:'Newsreader',serif;font-weight:400;font-size:25px;margin:0}
  .sechead .count{margin-left:auto;font-size:12.5px;color:var(--ink-mute)}
  .sizerow{padding:14px 24px 0}
  .sizes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .sizeb{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:13px 6px 11px;
    font-family:inherit;cursor:pointer;text-align:center;position:relative;transition:.3s var(--ease)}
  .sizeb[aria-pressed="true"]{border-color:var(--btn);border-width:2px}
  .sizeb b{display:block;font-family:'Newsreader',serif;font-weight:400;font-size:22px;line-height:1}
  .sizeb span{display:block;font-size:10px;color:var(--ink-mute);margin-top:3px;letter-spacing:.03em}
  .sizeb i{display:block;font-style:normal;font-size:11.5px;margin-top:6px}
  .sizeb .rec{position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:var(--accent);
    color:var(--ink);font-size:9.5px;padding:3px 8px;border-radius:999px;white-space:nowrap}
  .sizewhy{font-size:12.5px;color:var(--ink-soft);margin:10px 0 0;line-height:1.45}
  .shelf{margin-top:20px}
  .shelf h3{font-family:'Newsreader',serif;font-weight:400;font-size:18px;margin:0 0 11px;padding:0 24px}
  .rail{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x mandatory;
    scroll-padding-left:24px;padding-bottom:4px}
  .rail::-webkit-scrollbar{display:none}
  .rail::before,.rail::after{content:'';flex:0 0 24px}
  .rail .card{flex:0 0 152px;scroll-snap-align:start}
  .card{cursor:pointer}
  .card .img{height:132px;border-radius:13px;background:var(--surface);position:relative;margin-bottom:8px;
    display:flex;align-items:center;justify-content:center;font-size:32px;overflow:hidden}
  .card .tag{position:absolute;bottom:7px;left:7px;border-radius:999px;padding:4px 8px;font-size:10px;color:#3A342E}
  .card h4{font-size:13.5px;font-weight:400;line-height:1.3;margin:0 0 4px}
  .card .macros{font-size:11.5px;color:var(--ink-mute);margin:0;line-height:1.35}
  .plansec{background:var(--grey);margin-top:38px;padding:28px 24px 26px}
  .plansec h2{font-family:'Newsreader',serif;font-weight:400;font-size:25px;margin:0 0 14px}
  .pricebox{background:#fff;border-radius:14px;overflow:hidden}
  .pricehead{display:flex;align-items:center;gap:9px;padding:14px 15px;width:100%;background:none;
    border:none;font-family:inherit;font-size:14px;cursor:pointer;text-align:left}
  .pricehead .now{margin-left:auto;font-weight:500}
  .pricehead .was{color:var(--ink-mute);text-decoration:line-through;font-size:12.5px}
  .pricebody{max-height:0;overflow:hidden;transition:max-height .45s var(--ease)}
  .pricebody.open{max-height:240px}
  .pricebody .r{display:flex;justify-content:space-between;padding:10px 15px;font-size:12.5px;
    border-top:1px solid var(--line)}
  .pricebody .r span.g{color:#3E7A4E}
  .cartbar{display:flex;align-items:center;gap:13px;padding:14px 20px 20px}
  .cartbar .price b{display:block;font-size:16.5px;font-weight:500;line-height:1.2}
  .cartbar .price span{display:block;font-size:11.5px;color:var(--ink-mute)}
  .cartbar .cta{flex:1;height:50px}
  .cartbar.float{position:absolute;left:0;right:0;bottom:0;z-index:4;background:rgba(255,255,255,.95);
    backdrop-filter:blur(12px);border-top:1px solid var(--line);transition:.3s var(--ease)}
  .cartbar.float.gone{opacity:0;transform:translateY(100%);pointer-events:none}
  .cartbar.dock{margin:16px -24px -26px;padding:16px 24px 22px;border-top:1px solid var(--line)}
  .faq{padding:0 24px;margin-top:34px}
  .faq h2{font-family:'Newsreader',serif;font-weight:400;font-size:25px;margin:0 0 12px}
  .faq .q{border-top:1px solid var(--line)}
  .faq .q:last-child{border-bottom:1px solid var(--line)}
  .faq button{width:100%;background:none;border:none;font-family:inherit;text-align:left;padding:16px 0;
    font-size:14px;color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;
    align-items:center;gap:13px;line-height:1.4}
  .faq button .pm{font-size:16px;color:var(--ink-mute);transition:transform .35s var(--ease)}
  .faq button[aria-expanded="true"] .pm{transform:rotate(45deg)}
  .faq .a{overflow:hidden;max-height:0;transition:max-height .45s var(--ease)}
  .faq .a.open{max-height:240px}
  .faq .a p{font-size:13px;line-height:1.55;color:var(--ink-soft);margin:0 0 15px}
  .tail{padding:30px 24px 0}
  .tail p{font-size:12px;color:var(--ink-mute);line-height:1.55;margin:0}
  .gridwrap{position:relative;overflow:hidden;transition:max-height .5s var(--ease)}
  .gridview{display:grid;grid-template-columns:1fr 1fr;gap:18px 12px;padding:18px 24px 0}
  .gridfade{position:absolute;left:0;right:0;bottom:0;height:120px;pointer-events:none;
    background:linear-gradient(to bottom,rgba(255,255,255,0),rgba(255,255,255,.92) 58%,#fff);
    display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;transition:.3s}
  .gridwrap.open .gridfade{opacity:0}
  .seemore{pointer-events:auto;background:#fff;border:1.5px solid var(--line);border-radius:999px;
    font-family:inherit;font-size:13.5px;padding:12px 20px;cursor:pointer}

  /* sheet + toast */
  .scrim{position:absolute;inset:0;background:rgba(20,17,15,.42);opacity:0;pointer-events:none;
    transition:opacity .4s var(--ease);z-index:8}
  .scrim.on{opacity:1;pointer-events:auto}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;

  screenEl.innerHTML=html;screenEl.scrollTop=0}
function foot(h,over){footerEl.className='footer'+(over?' over':'');footerEl.innerHTML=h}
const backBtn=()=>document.getElementById('back');
const ctaBtn=()=>document.getElementById('cta');
const go=n=>{dir=n>step?'push':'pop';step=n;render()};

function renderIntro(){
  phone.classList.add('cream');screenEl.className='screen';
  screenEl.innerHTML=`<div class="page ${dir}"><div class="intro">
    <h1>A few questions about how you eat.</h1>
    <p class="lead">Then we’ll show you which plan we’d start you with, and why.</p>
    <ul>
      <li style="animation-delay:.24s"><b>·</b><span>7 questions, nothing tricky</span></li>
      <li style="animation-delay:.31s"><b>·</b><span>About a minute</span></li>
      <li style="animation-delay:.38s"><b>·</b><span>No email needed to see your result</span></li>
    </ul></div></div>`;
  foot('<button class="cta" id="cta">Start</button>');
  ctaBtn().onclick=()=>go(step+1);
}

function renderQ(q){
  if(q.type==='slider') return renderSlider(q);
  const picked=q.type==='multi'?many(q.id):[one(q.id)];
  const grid=q.style==='grid';
  shell(`<p class="qlabel">Question ${q.n} of ${Q.length}</p>${progressBar()}
    <div class="page ${dir}">
      <h1 class="${q.sub?'':'solo'}">${q.q}</h1>
      ${q.sub?`<p class="sub">${q.sub}</p>`:''}
      <div class="opts${grid?' grid':''}">${q.o.map(([e,t],i)=>`
        <button class="opt" data-t="${t.replace(/"/g,'&quot;')}" aria-pressed="${picked.includes(t)}"
          style="animation-delay:${.1+i*.04}s"><em>${e}</em><span>${t}</span>
          ${q.type==='multi'?'<span class="tick">✓</span>':''}</button>`).join('')}</div>
    </div>`);
  foot(`<button class="back" id="back">&#8249;</button>${
    q.type==='multi'?'<button class="cta" id="cta">Continue</button>':''}`);
  backBtn().onclick=()=>go(step-1);
  if(q.type==='multi') ctaBtn().onclick=()=>go(step+1);
  screenEl.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const t=b.dataset.t;
    if(q.type==='multi'){
      const cur=new Set(many(q.id)); cur.has(t)?cur.delete(t):cur.add(t); A[q.id]=[...cur];
      screenEl.querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-pressed',cur.has(x.dataset.t)));
      updatePanel();
    } else {
      A[q.id]=[t];
      screenEl.querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-pressed','false'));
      b.setAttribute('aria-pressed','true'); updatePanel();
      setTimeout(()=>go(step+1),300);
    }
  });
}

function renderSlider(q){
  const v=+(one('sat')||5), touched=!!one('sat'), z=zoneOf(v);
  shell(`<p class="qlabel">Question ${q.n} of ${Q.length}</p>${progressBar()}
    <div class="page ${dir}">
      <h1 class="solo">${q.q}</h1>
      <div class="satstage">
        <div class="satface" id="face">${touched?faceOf(v):'🙂'}</div>
        <p class="satzone" id="zone">${touched?z.label:'&nbsp;'}</p>
      </div>
      <div class="satmsg"><div class="inner${touched?' on':''}" id="msg">${touched?z.msg:''}</div></div>
      <div class="sliderwrap">
        <input type="range" min="1" max="10" value="${v}" id="sl" style="--pct:${(v-1)/9*100}%">
        <div class="ends"><span>Not satisfied</span><span>Very satisfied</span></div>
      </div></div>`);
  foot(`<button class="back" id="back">&#8249;</button>
    <button class="cta" id="cta" ${touched?'':'disabled'}>Continue</button>`);
  backBtn().onclick=()=>go(step-1);
  ctaBtn().onclick=()=>go(step+1);
  const sl=document.getElementById('sl'),face=document.getElementById('face'),
        zone=document.getElementById('zone'),msg=document.getElementById('msg');
  sl.addEventListener('input',()=>{
    const val=+sl.value,zz=zoneOf(val);
    sl.style.setProperty('--pct',(val-1)/9*100+'%'); A.sat=[String(val)];
    face.textContent=faceOf(val);face.classList.add('bump');
    setTimeout(()=>face.classList.remove('bump'),220);
    zone.textContent=zz.label; msg.classList.remove('on'); updatePanel();
  });
  const settle=()=>{const zz=zoneOf(+sl.value);A.sat=[sl.value];msg.textContent=zz.msg;
    requestAnimationFrame(()=>msg.classList.add('on'));ctaBtn().disabled=false;updatePanel()};
  ['change','pointerup','touchend','keyup'].forEach(e=>sl.addEventListener(e,settle));
}

function renderInt(copy,which){
  const [head,sub]=copy||['Got it.',''];
  phone.classList.remove('cream'); screenEl.className='screen flush';
  screenEl.innerHTML=`<div class="page ${dir}" style="flex:1"><div class="inter">
    <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"
      stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
    <h1>${head}</h1>${sub?`<p>${sub}</p>`:''}</div></div>`;
  foot(`<button class="back" id="back">&#8249;</button>
    <button class="cta" id="cta">Keep Going</button>`,true);
  backBtn().onclick=()=>go(step-1);
  ctaBtn().onclick=()=>go(step+1);
}

function renderLoad(){
  phone.classList.add('cream');screenEl.className='screen';foot('');
  routing=route(); computeSize(); selected=null; matchIdx=0;
  const chips=learned().slice(0,5).map(t=>t.split(':')[1]);
  screenEl.innerHTML=`<div class="page push"><div class="load">
    <div class="ring"></div><h1>Finding your match</h1>
    <p>Matching what you told us to the menu.</p>
    <div class="chips">${chips.map((c,i)=>
      `<span class="chip" style="animation-delay:${.15+i*.25}s">${c}</span>`).join('')}</div>
  </div></div>`;
  updatePanel();
  setTimeout(()=>go(step+1),1900);
}

function renderMatch(){
  phone.classList.remove('cream');screenEl.className='screen flush';foot('');
  const rec=routing.bundle, order=[rec,...BK.filter(k=>k!==rec)];
  if(selected===null) selected=rec;
  matchIdx=Math.max(0,order.indexOf(selected));
  const stack=`<span class="stack"><i></i><i></i><i></i></span>`;
  const card=(bk,i)=>{const b=B[bk],s=b.spec;
    return `<div class="matchcard${i===matchIdx?' active':''}"
      style="${i===matchIdx?`border-color:${b.colour}`:''}">
    <div class="matchimg" style="background:${b.colour}">${b.icon}
      ${bk===rec?'<span class="matchbadge"><b>✓</b>Best match</span>':''}</div>
    <div class="matchbody">
      <h3>${b.name}</h3>
      <p class="matchdesc">${b.desc}</p>
      <div class="mtags">${b.tags.map(t=>`<span class="mtag">${t}</span>`).join('')}</div>
      <div class="spec">
        <div class="specrow"><span class="lab">Included</span>
          <span class="contents">${s.contents.map(([n,l])=>
            `<span class="citem">${stack}${n} ${l}</span>`).join('')}</span></div>
        <div class="nut">
          <div><span class="lab">Protein</span><span class="val">${s.protein}</span></div>
          <div><span class="lab">Fibre</span><span class="val">${s.fibre}</span></div>
          <div><span class="lab">Calories</span><span class="val">${s.kcal}</span></div>
        </div>
      </div>
      <button class="matchcta" data-continue>Continue</button>
    </div></div>`};
  screenEl.innerHTML=`<div class="page push"><div class="matchwrap">
    <div class="matchnav">
      <button id="mback">&#8249;</button>
      <h1>Here’s your match</h1>
      <button id="mclose">&times;</button>
    </div>
    <div class="matchrail" id="mrail">${order.map((b,i)=>card(b,i)).join('')}</div>
    <div class="matchdots">${order.map((_,i)=>`<span class="dot${i===matchIdx?' on':''}"></span>`).join('')}</div>
  </div></div>`;
  document.getElementById('mback').onclick=()=>go(step-1);
  document.getElementById('mclose').onclick=()=>{A={};routing=null;selected=null;go(0)};
  screenEl.querySelectorAll('[data-continue]').forEach(b=>b.onclick=e=>{
    e.stopPropagation(); selected=order[matchIdx]; go(step+1)});

  const rail=document.getElementById('mrail');
  const centre=i=>{const c=rail.children[i];
    rail.scrollTo({left:c.offsetLeft-(rail.clientWidth-c.offsetWidth)/2,behavior:'smooth'})};
  const jump=i=>{const c=rail.children[i];
    rail.scrollLeft=c.offsetLeft-(rail.clientWidth-c.offsetWidth)/2};
  requestAnimationFrame(()=>jump(matchIdx));
  const nearest=()=>{const rc=rail.getBoundingClientRect(),mid=rc.left+rc.width/2;
    let best=0,bd=1e9;[...rail.children].forEach((c,i)=>{const cc=c.getBoundingClientRect();
      const d=Math.abs(cc.left+cc.width/2-mid);if(d<bd){bd=d;best=i}});return best};
  const setActive=i=>{if(i===matchIdx)return;matchIdx=i;selected=order[i];
    [...rail.children].forEach((c,n)=>{c.classList.toggle('active',n===i);
      c.style.borderColor=n===i?B[order[n]].colour:'transparent'});
    screenEl.querySelectorAll('.dot').forEach((d,n)=>d.classList.toggle('on',n===i));updatePanel()};
  let raf=null;
  rail.addEventListener('scroll',()=>{if(raf)return;
    raf=requestAnimationFrame(()=>{raf=null;setActive(nearest())})},{passive:true});
  let drag=false,sx=0,ss=0,moved=0;
  rail.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')return;
    drag=true;moved=0;sx=e.clientX;ss=rail.scrollLeft;rail.classList.add('dragging');
    rail.setPointerCapture(e.pointerId)});
  rail.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-sx;
    moved=Math.max(moved,Math.abs(dx));rail.scrollLeft=ss-dx});
  const end=()=>{if(!drag)return;drag=false;rail.classList.remove('dragging');
    const i=nearest();setActive(i);centre(i)};
  rail.addEventListener('pointerup',end);rail.addEventListener('pointercancel',end);
  [...rail.children].forEach((c,i)=>c.onclick=()=>{if(moved>6)return;if(i!==matchIdx)centre(i)});
}

function buildBox(bk){
  const dinners=MEALS.filter(m=>m.t==='dinner');
  if(B[bk].kind==='dinner') return dinners.slice(0,boxSize);
  const nD=Math.round(boxSize*.6),nB=Math.round(boxSize*.25);
  const box=[...dinners.slice(0,nD),...MEALS.filter(m=>m.t==='breakfast').slice(0,nB),
             ...MEALS.filter(m=>m.t==='snack')];
  for(const m of dinners){if(box.length>=boxSize)break;if(!box.includes(m))box.push(m)}
  return box.slice(0,boxSize);
}
function mealTag(m,bk){
  if(m.t!=='dinner') return m.b==='best'?'Bestseller':m.b==='new'?'New':null;
  if(m.p>=23&&B[bk].lead!=='High protein') return 'High protein';
  if(m.f>=13) return 'High fibre';
  if(m.b==='best') return 'Bestseller';
  if(m.b==='new') return 'New';
  if(m.k<=460&&B[bk].lead!=='Pre-portioned') return 'Under 500 kcal';
  return null;
}
function cardHtml(m,bk){
  const tag=mealTag(m,bk);
  const macros=m.t==='dinner'?`${m.p}g protein · ${m.f}g fibre · ${m.k} kcal`:`${m.p}g protein · ${m.k} kcal`;
  return `<div class="card" data-i="${MEALS.indexOf(m)}"><div class="img">${m.e}
    ${tag?`<span class="tag" style="background:var(${TAGCOL[tag]||'--surface'})">${tag}</span>`:''}
    </div><h4>${m.n}</h4><p class="macros">${macros}</p></div>`;
}

function renderResults(){
  phone.classList.remove('cream');screenEl.className='screen flush';foot('');
  const bk=selected||routing.bundle, bundle=B[bk], box=buildBox(bk);
  const tags=buildTags(bk), cards=buildCards();
  const groups={};box.forEach(m=>{(groups[m.t]=groups[m.t]||[]).push(m)});
  const list=boxSize*LIST, final=boxSize*SIZES[boxSize], d20=list*.2, qty=list-d20-final;
  const bar=c=>`<div class="cartbar ${c}"><div class="price"><b>€${final.toFixed(2)}</b>
    <span>€${SIZES[boxSize].toFixed(2)} / meal</span></div>
    <button class="cta" data-add>Add to cart</button></div>`;
  screenEl.innerHTML=`<div class="page push"><div class="res">
    <div class="heroblock">
      <div class="navbar"><button id="rback">&#8249;</button><h6>Your plan</h6></div>
      <div class="hero-img" style="background:${bundle.colour}">${bundle.icon}</div>
      <p class="planname">${bundle.name}</p>
      <h1>${headline()}</h1>
      <div class="tagrow">${tags.map(([e,t])=>`<span class="utag"><em>${e}</em>${t}</span>`).join('')}</div>
      <div class="mapsec"><h2>Why this one’s for you</h2>
        <div class="maprail">${cards.map(([ic,txt,src])=>`<div class="mapcard">
          <div class="ic">${ic}</div><span class="src">${src}</span><p>${txt}</p></div>`).join('')}</div>
      </div>
    </div>
    <div class="sechead"><h2>In your box</h2><span class="count">${box.length} meals</span></div>
    <div class="sizerow"><div class="sizes">${Object.keys(SIZES).map(n=>`
      <button class="sizeb" data-size="${n}" aria-pressed="${+n===boxSize}">
        ${+n===boxSize&&sizeReason?'<span class="rec">Recommended</span>':''}
        <b>${n}</b><span>MEALS</span><i>€${SIZES[n].toFixed(2)} / meal</i></button>`).join('')}</div>
      ${sizeReason?`<p class="sizewhy">${sizeReason}</p>`:''}</div>
    ${bundle.kind==='full'
      ? Object.keys(groups).map(t=>`<div class="shelf"><h3>${TYPE_LABEL[t]}</h3>
          <div class="rail">${groups[t].map(m=>cardHtml(m,bk)).join('')}</div></div>`).join('')
      : `<div class="gridwrap" id="gridwrap"><div class="gridview" id="gridview">
          ${box.map(m=>cardHtml(m,bk)).join('')}</div>
          ${box.length>8?`<div class="gridfade"><button class="seemore" id="seemore">See more meals</button></div>`:''}
        </div>`}
    <div class="plansec"><h2>Your plan</h2>
      <div class="pricebox">
        <button class="pricehead" id="ph" aria-expanded="${priceOpen}">
          ${bundle.name.replace(' Bundle','').replace(' Plan','')}
          <span class="now">€${final.toFixed(2)}</span><span class="was">€${list.toFixed(2)}</span></button>
        <div class="pricebody${priceOpen?' open':''}" id="pb">
          <div class="r"><span>Box price</span><span>€${final.toFixed(2)}</span></div>
          <div class="r"><span>Discount (−20%)</span><span class="g">−€${d20.toFixed(2)}</span></div>
          <div class="r"><span>Quantity discount</span><span class="g">−€${qty.toFixed(2)}</span></div>
          <div class="r"><span>Shipping</span><span>Free</span></div>
        </div></div>
      ${bar('dock')}
    </div>
    <div class="faq"><h2>Dig a little deeper</h2>
      ${FAQ.map(([q,a],i)=>`<div class="q">
        <button data-faq="${i}" aria-expanded="false">${q}<span class="pm">+</span></button>
        <div class="a" id="faq${i}"><p>${a}</p></div></div>`).join('')}</div>
    <div class="tail"><p>This first box comes as it is. From your next delivery you can swap in
      anything from the full menu — pause, skip or cancel whenever you like.</p></div>
  </div></div>${bar('float gone')}`;
  const fl=screenEl.querySelector('.cartbar.float'), dk=screenEl.querySelector('.cartbar.dock');
  const sync=()=>{const sr=screenEl.getBoundingClientRect(),dr=dk.getBoundingClientRect();
    fl.classList.toggle('gone',dr.top<sr.bottom-12)};
  screenEl.addEventListener('scroll',sync,{passive:true});requestAnimationFrame(sync);
  document.getElementById('rback').onclick=()=>go(step-1);
  screenEl.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>toast('Added — this is a prototype.'));
  document.getElementById('ph').onclick=()=>{priceOpen=!priceOpen;
    document.getElementById('pb').classList.toggle('open',priceOpen);requestAnimationFrame(sync)};
  screenEl.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{boxSize=+b.dataset.size;render()});
  screenEl.querySelectorAll('[data-faq]').forEach(b=>b.onclick=()=>{
    const o=b.getAttribute('aria-expanded')==='true';b.setAttribute('aria-expanded',!o);
    document.getElementById('faq'+b.dataset.faq).classList.toggle('open',!o)});
  screenEl.querySelectorAll('.card').forEach(c=>c.onclick=()=>openSheet(+c.dataset.i,bk));
  const gw=document.getElementById('gridwrap');
  if(gw){const gv=document.getElementById('gridview'),more=document.getElementById('seemore');
    if(more){requestAnimationFrame(()=>{const e8=gv.children[8];if(e8)gw.style.maxHeight=(e8.offsetTop+52)+'px'});
      more.onclick=()=>{gw.style.maxHeight=gv.scrollHeight+'px';gw.classList.add('open');
        setTimeout(()=>{gw.style.maxHeight='none';requestAnimationFrame(sync)},540)}}}
}

function openSheet(i,bk){
  const m=MEALS[i];if(!m)return;
  sheetEl.innerHTML=`<div class="grab"></div><div class="shero">${m.e}</div>
    <h3>${m.n}</h3><p class="reason">${whyThis(m)}</p>
    <dl><div><dt>Protein</dt><dd>${m.p} g</dd></div>
    <div><dt>Fibre</dt><dd>${m.f} g</dd></div>
    <div><dt>Calories</dt><dd>${m.k} kcal</dd></div>
    <div><dt>Course</dt><dd>${TYPE_LABEL[m.t]}</dd></div>
    <div><dt>Ready in</dt><dd>10 minutes</dd></div></dl>
    <button class="close" id="sclose">Close</button>`;
  sheetEl.classList.add('on');scrimEl.classList.add('on');
  document.getElementById('sclose').onclick=closeSheet;
}
function closeSheet(){sheetEl.classList.remove('on');scrimEl.classList.remove('on')}
function whyThis(m){
  const w=many('watch');
  if(w.includes('Getting more protein')&&m.p>=23) return `You said you want more protein — this one has ${m.p} g.`;
  if(w.includes('Eating more fibre')&&m.f>=13) return `Higher in fibre than most — ${m.f} g in this one.`;
  if(one('eater')==='I love trying new tastes'&&m.b==='new') return 'One of the newer dishes this season.';
  if(one('eater')==='I like sticking to my favorites'&&m.b==='best') return 'One of the most ordered dishes on the menu.';
  if(m.b==='best') return 'One of the most ordered dishes on the menu.';
  return 'Ten minutes from freezer to plate, like everything else in the box.';
}

/* ═══════════ PANEL ═══════════ */
function updatePanel(){
  panelEl.hidden=!showPanel; if(!showPanel) return;
  const k=STEPS[step];
  const stage=k==='intro'?'Intro':k==='int1'?'Interstitial · after Q1':k==='int2'?'Interstitial · after Q3'
    :k==='load'?'Loader':k==='match'?'Match':k==='results'?'Results':`Q${Q[+k.slice(1)].n} · ${Q[+k.slice(1)].id}`;
  const live=Object.keys(A).length?route():null;
  const max=live?Math.max(1,...Object.values(live.scores)):1;
  const shown=selected||(live&&live.bundle);
  const tg=learned();
  let sizeNote='awaiting Q5';
  if(one('household')&&HH_SIZE[one('household')]) sizeNote=HH_SIZE[one('household')][0]+' meals · from household';
  panelEl.innerHTML=`
    <h4>Flow</h4>
    <div class="r"><span>Stage</span><code>${stage}</code></div>
    <div class="r"><span>Screen</span><code>${step+1} of ${STEPS.length}</code></div>
    <hr><h4>Answers</h4>
    ${Object.keys(A).length?Object.entries(A).map(([kk,v])=>
      `<div class="r"><span>${kk}</span><code>${v.join(', ').slice(0,32)}</code></div>`).join('')
      :'<div class="r dim"><code>nothing yet</code></div>'}
    <hr><h4>Tags learned</h4>
    ${tg.length?tg.map(t=>`<span class="tg">${t}</span>`).join(''):'<span class="note">none yet</span>'}
    <hr><h4>Bundle scores</h4>
    ${live?BK.map(kk=>{const v=live.scores[kk],win=kk===live.bundle;
      return `<div class="r${win?' win':''}"><span>${B[kk].name}</span><span>${v}</span></div>
        <div class="bar"><i class="${win?'win':''}" style="width:${Math.round(v/max*100)}%"></i></div>`}).join('')
      :'<span class="note">waiting for answers</span>'}
    ${selected&&live&&selected!==live.bundle
      ?`<div class="r win"><span>Manually picked</span><code>${B[selected].name}</code></div>`:''}
    <hr><h4>Output</h4>
    <div class="r"><span>Plan shown</span><code>${shown?B[shown].name:'—'}</code></div>
    <div class="r"><span>Box size</span><code>${sizeNote}</code></div>
    <div class="r"><span>Headline</span></div>
    <div class="r"><code>${one('goal')?headline().replace(/<[^>]+>/g,''):'—'}</code></div>
    <div class="r"><span>Lead USP suppressed</span><code>${shown?(B[shown].lead||'—'):'—'}</code></div>
    ${shown?`<div class="r"><span>Tags</span></div>
      <div class="r"><code>${buildTags(shown).map(t=>t[1]).join(' · ')}</code></div>`:''}
    ${live&&live.trace.length?`<hr><h4>Trace</h4>
      ${live.trace.map(t=>`<div class="r"><code>${t}</code></div>`).join('')}`:''}`;
}

document.querySelector('[data-panel]').onclick=e=>{
  showPanel=!showPanel;e.currentTarget.setAttribute('aria-pressed',showPanel);updatePanel()};
document.getElementById('restart').onclick=()=>{
  A={};routing=null;selected=null;boxSize=16;sizeReason='';priceOpen=false;go(0)};
render();
</script>
